<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Runner 3D — by Priew</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#06060f;overflow:hidden;font-family:'Nunito',sans-serif;user-select:none;}

/* Canvas sits behind everything */
#c{position:fixed;top:0;left:0;display:block;z-index:1;}

/* HUD on top of canvas */
#hud{position:fixed;top:0;left:0;width:100%;z-index:20;display:none;pointer-events:none;}
#top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px;}
.hud-pill{background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:7px 16px;color:#fff;font-size:14px;font-weight:700;}
#quit-btn{background:rgba(220,50,50,0.25);border:1px solid rgba(220,50,50,0.5);border-radius:20px;padding:7px 16px;color:#fca5a5;font-size:14px;font-weight:700;cursor:pointer;pointer-events:all;}
#quit-btn:hover{background:rgba(220,50,50,0.5);}

#question-center{position:fixed;top:14px;left:50%;transform:translateX(-50%);text-align:center;z-index:20;pointer-events:none;white-space:nowrap;display:none;}
#question-box{background:rgba(0,0,0,0.78);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,0.2);border-radius:20px;padding:10px 32px;display:inline-block;}
#q-text{font-family:'Fredoka One',cursive;font-size:36px;color:#fff;text-shadow:0 0 20px rgba(147,197,253,0.8);}
#timer-wrap{margin:8px auto 0;width:240px;}
#timer-bg{background:rgba(255,255,255,0.12);border-radius:8px;height:10px;overflow:hidden;}
#timer-fill{height:100%;border-radius:8px;background:#4ade80;transition:width 0.08s linear,background 0.4s;}

#flash{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:19;opacity:0;transition:opacity 0.2s;}
#floor-badge{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:7px 20px;color:#94a3b8;font-size:14px;font-weight:700;z-index:20;pointer-events:none;display:none;}

/* ── OVERLAY — z-index above canvas ── */
#overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:50;           /* well above canvas z:1 */
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
#overlay::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#0f0c2e,#1a0533 35%,#0c1a3a 65%,#0a1628);z-index:0;}
#star-canvas{position:absolute;inset:0;z-index:1;pointer-events:none;}
.float-sym{position:absolute;font-family:'Fredoka One',cursive;color:rgba(255,255,255,0.07);pointer-events:none;z-index:2;animation:floatUp linear infinite;}
@keyframes floatUp{0%{transform:translateY(110vh) rotate(0deg);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(-20vh) rotate(360deg);opacity:0;}}
#overlay-content{position:relative;z-index:10;text-align:center;padding:16px 24px;}
.title-line1{font-family:'Fredoka One',cursive;font-size:clamp(42px,8vw,76px);color:#fff;letter-spacing:3px;line-height:1.05;text-shadow:0 0 60px rgba(96,165,250,0.9);animation:tPop .6s cubic-bezier(.34,1.56,.64,1) both;}
.title-line2{font-family:'Fredoka One',cursive;font-size:clamp(22px,4vw,46px);background:linear-gradient(90deg,#f59e0b,#ef4444,#ec4899,#8b5cf6,#3b82f6,#06b6d4);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gShift 3s linear infinite,tPop .6s .1s cubic-bezier(.34,1.56,.64,1) both;letter-spacing:2px;margin-bottom:4px;}
@keyframes gShift{0%{background-position:0%}100%{background-position:200%}}
@keyframes tPop{0%{opacity:0;transform:scale(.6) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.badge{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:30px;padding:8px 20px;margin:10px 0 18px;animation:fUp .5s .3s both;}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ec4899);display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:15px;color:#fff;}
.dn{font-size:14px;font-weight:900;color:#fde68a;}
.how-to{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;animation:fUp .5s .4s both;}
.hc{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:10px 14px;text-align:center;color:#94a3b8;font-size:12px;min-width:78px;}
.hc .ic{font-size:20px;margin-bottom:4px;}
.hc strong{display:block;color:#cbd5e1;font-size:12px;margin-bottom:2px;}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fUp .5s .5s both;}
.play-btn{background:linear-gradient(135deg,#3b82f6,#8b5cf6,#ec4899);color:#fff;border:none;padding:14px 44px;border-radius:32px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 0 50px rgba(99,102,241,.5);transition:transform .12s;font-family:'Nunito',sans-serif;}
.play-btn:hover{transform:scale(1.06);}
.lb-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#cbd5e1;padding:14px 24px;border-radius:32px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.lb-btn:hover{background:rgba(255,255,255,.15);}
#final-score{font-size:20px;color:#fde68a;font-weight:900;margin-bottom:14px;line-height:1.7;animation:fUp .4s both;}
.note{margin-top:12px;font-size:11px;color:#475569;animation:fUp .5s .7s both;}
.sparkle{position:absolute;pointer-events:none;z-index:3;width:5px;height:5px;border-radius:50%;animation:spark 2s ease-in-out infinite;}
@keyframes spark{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
@keyframes fUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Leaderboard */
#lb-panel{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,20,.93);backdrop-filter:blur(12px);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.lbt{font-family:'Fredoka One',cursive;font-size:36px;color:#fff;text-shadow:0 0 30px rgba(250,204,21,.6);margin-bottom:20px;}
.lbtable{width:100%;max-width:420px;border-collapse:collapse;margin-bottom:20px;}
.lbtable th{font-family:'Fredoka One',cursive;font-size:13px;color:#94a3b8;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;}
.lbtable td{padding:10px 12px;font-size:15px;font-weight:700;color:#e2e8f0;border-bottom:1px solid rgba(255,255,255,.06);}
.lbtable .r1 td{color:#fbbf24}.lbtable .r2 td{color:#9ca3af}.lbtable .r3 td{color:#b45309}
.lbc{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;padding:12px 32px;border-radius:24px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}

/* Name modal */
#name-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,20,.88);backdrop-filter:blur(12px);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#name-modal h2{font-family:'Fredoka One',cursive;font-size:28px;color:#fff;}
#name-modal p{color:#94a3b8;font-size:14px;}
#ni{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);color:#fff;padding:12px 20px;border-radius:16px;font-size:18px;font-weight:700;font-family:'Nunito',sans-serif;text-align:center;outline:none;width:220px;}
#ni:focus{border-color:rgba(99,102,241,.7);}
#ns{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border:none;padding:12px 32px;border-radius:24px;font-size:16px;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;}

/* Mobile dpad */
#dpad{position:fixed;bottom:20px;left:16px;z-index:30;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px;display:none;}
.dp{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
.dp:active{background:rgba(255,255,255,.3);}
#btn-jump{position:fixed;bottom:28px;right:20px;z-index:30;width:64px;height:64px;border-radius:50%;background:rgba(99,102,241,.35);border:2px solid rgba(99,102,241,.7);color:#fff;font-size:24px;display:none;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud">
  <div id="top-bar">
    <div class="hud-pill">Floor <span id="floor-val">1</span></div>
    <div class="hud-pill">⭐ <span id="score-val">0</span></div>
    <button id="quit-btn">✕ Quit</button>
  </div>
</div>
<div id="question-center">
  <div id="question-box"><div id="q-text">?</div></div>
  <div id="timer-wrap"><div id="timer-bg"><div id="timer-fill"></div></div></div>
</div>
<div id="floor-badge">⬇ Floor <span id="nf-val">2</span></div>
<div id="flash"></div>

<!-- OVERLAY (welcome / game over) -->
<div id="overlay">
  <canvas id="star-canvas"></canvas>
  <div id="float-syms"></div>
  <div id="overlay-content">
    <div class="title-line1" id="tl1">Math Runner</div>
    <div class="title-line2" id="tl2">3D Tower ✨</div>
    <div class="badge"><div class="av">P</div><div class="dn">Designed by Priew 🌸</div></div>
    <div class="how-to">
      <div class="hc"><div class="ic">🎮</div><strong>Move</strong>WASD/Arrows</div>
      <div class="hc"><div class="ic">🖱️</div><strong>Camera</strong>Drag to rotate</div>
      <div class="hc"><div class="ic">⬆️</div><strong>Jump</strong>Space</div>
      <div class="hc"><div class="ic">🧮</div><strong>Answer</strong>Step on it!</div>
      <div class="hc"><div class="ic">⬇️</div><strong>Wrong</strong>Fall a floor!</div>
    </div>
    <div id="final-score" style="display:none;"></div>
    <div class="btn-row">
      <button class="play-btn" id="play-btn">▶ Let's Play!</button>
      <button class="lb-btn" id="lb-open">🏆 Leaderboard</button>
    </div>
    <div class="note">WASD · Space to jump · Drag to rotate camera</div>
  </div>
</div>

<!-- Leaderboard -->
<div id="lb-panel">
  <div class="lbt">🏆 Leaderboard</div>
  <table class="lbtable"><thead><tr><th>#</th><th>Name</th><th>Score</th><th>Floor</th></tr></thead><tbody id="lb-body"></tbody></table>
  <button class="lbc" id="lb-close">← Back</button>
</div>

<!-- Name modal -->
<div id="name-modal">
  <h2>🎉 Great Score!</h2><p>Enter your name</p>
  <input id="ni" type="text" maxlength="12" placeholder="Your name" autocomplete="off"/>
  <button id="ns">Save Score ⭐</button>
</div>

<!-- Mobile controls (shown on touch devices) -->
<div id="dpad">
  <div></div><div class="dp" id="dp-up">▲</div><div></div>
  <div class="dp" id="dp-left">◀</div><div></div><div class="dp" id="dp-right">▶</div>
  <div></div><div class="dp" id="dp-down">▼</div><div></div>
</div>
<div id="btn-jump" style="display:none;">↑</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ── Detect touch device ──
if('ontouchstart' in window){
  document.getElementById('dpad').style.display='grid';
  document.getElementById('btn-jump').style.display='flex';
}

// ── Welcome screen animations ──
(function(){
  const sc=document.getElementById('star-canvas'),g=sc.getContext('2d');
  let W,H; const stars=[];
  function rs(){W=sc.width=innerWidth;H=sc.height=innerHeight;}
  rs();window.addEventListener('resize',rs);
  for(let i=0;i<160;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+0.3,a:Math.random(),da:(Math.random()-.5)*.008+.003,sp:Math.random()*.00004+.00002});
  function draw(){
    g.clearRect(0,0,W,H);
    stars.forEach(s=>{s.a+=s.da;if(s.a>1||s.a<0)s.da*=-1;s.y-=s.sp;if(s.y<0){s.y=1;s.x=Math.random();}g.beginPath();g.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);g.fillStyle=`rgba(255,255,255,${s.a*.8})`;g.fill();});
    if(document.getElementById('overlay').style.display!=='none')requestAnimationFrame(draw);
  }
  draw();
  ['+','−','×','÷','=','?','√','²','7','9','12','π'].forEach(sym=>{
    const d=document.createElement('div');d.className='float-sym';d.textContent=sym;
    d.style.cssText=`font-size:${Math.random()*48+18}px;left:${Math.random()*100}%;animation-duration:${6+Math.random()*10}s;animation-delay:${-Math.random()*12}s;`;
    document.getElementById('float-syms').appendChild(d);
  });
  for(let i=0;i<18;i++){
    const s=document.createElement('div');s.className='sparkle';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;background:${['#f59e0b','#ec4899','#8b5cf6','#3b82f6','#4ade80'][~~(Math.random()*5)]};animation-delay:${Math.random()*2}s;animation-duration:${1.5+Math.random()*1.5}s;`;
    document.getElementById('overlay').appendChild(s);
  }
})();

// ── Leaderboard ──
const LB_KEY='mathrunner_v3';
const loadLB=()=>{try{return JSON.parse(localStorage.getItem(LB_KEY))||[];}catch{return[];}};
function saveLB(lb){try{localStorage.setItem(LB_KEY,JSON.stringify(lb));}catch{}}
function addToLB(name,sc,floor){const lb=loadLB();lb.push({name,score:sc,floor});lb.sort((a,b)=>b.score-a.score);lb.splice(10);saveLB(lb);}
function renderLB(){
  const lb=loadLB(),m=['🥇','🥈','🥉'],tb=document.getElementById('lb-body');
  tb.innerHTML=lb.length?lb.map((e,i)=>`<tr class="${['r1','r2','r3'][i]||''}"><td>${m[i]||'#'+(i+1)}</td><td>${e.name}</td><td>⭐${e.score}</td><td>F${e.floor}</td></tr>`).join(''):`<tr><td colspan="4" style="text-align:center;color:#475569;padding:20px">No scores yet!</td></tr>`;
}
document.getElementById('lb-open').addEventListener('click',()=>{renderLB();document.getElementById('lb-panel').style.display='flex';});
document.getElementById('lb-close').addEventListener('click',()=>{document.getElementById('lb-panel').style.display='none';});
let pScore=null;
function askName(sc,floor){pScore={sc,floor};document.getElementById('ni').value='';document.getElementById('name-modal').style.display='flex';setTimeout(()=>document.getElementById('ni').focus(),100);}
document.getElementById('ns').addEventListener('click',()=>{
  const n=(document.getElementById('ni').value.trim()||'Player').slice(0,12);
  if(pScore){addToLB(n,pScore.sc,pScore.floor);pScore=null;}
  document.getElementById('name-modal').style.display='none';
});
document.getElementById('ni').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('ns').click();});

// ═══════════════════════════════════════════════
//  THREE.JS
// ═══════════════════════════════════════════════
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0x06060f,1);
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x06060f,32,85);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);
camera.position.set(0,12,12);

// Lights
scene.add(new THREE.AmbientLight(0x223355,1.0));
const sun=new THREE.DirectionalLight(0xffeedd,1.8);
sun.position.set(8,18,8);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near=.5;sun.shadow.camera.far=60;
sun.shadow.camera.left=-14;sun.shadow.camera.right=14;
sun.shadow.camera.top=14;sun.shadow.camera.bottom=-14;
sun.shadow.bias=-.002;
scene.add(sun);
const fill=new THREE.DirectionalLight(0x3344ff,.3);fill.position.set(-6,4,-6);scene.add(fill);
const ptL=new THREE.PointLight(0x6688ff,.7,24);scene.add(ptL);

// Stars mesh
{const g=new THREE.BufferGeometry(),v=[];
for(let i=0;i<1600;i++)v.push((Math.random()-.5)*180,Math.random()*60+6,(Math.random()-.5)*180);
g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.18})));}

// ── Grid ──
const COLS=5,ROWS=5,TW=2.2,TH=.55,STEP=TW;
const OX=-(COLS-1)*STEP/2, OZ=-(ROWS-1)*STEP/2;
const TFLOOR=TH/2;   // top surface = group.y + TFLOOR
const FDROP=18;       // vertical gap between floors
const HALF=TW/2+.04; // XZ collision half-extent

const PAL=[
  0xc0392b,0xd35400,0xcca900,0x1a7a3e,0x12756a,
  0x1f6393,0x6c3483,0xad1457,0x007c8a,0xbf4a16,
  0x4a7c23,0xcc6600,0x2e4a55,0x4a2c20,0x3d1f8a,
  0x005a50,0xb5134f,0x007a8a,0x2d7a30,0xcc6200,
  0x9b1515,0x0f4f99,0x5a1580,0x00574a,0xd48600
];

// ── Roblox camera state ──
const cam={
  yaw:Math.PI, pitch:.42, dist:10,
  ty:Math.PI,  tp:.42,    td:10,
  dragging:false
};

// ── Game state ──
let tiles=[], oldTiles=[];
let pGrp=null, pVel=new THREE.Vector3(), pOnGround=false;
let keys={};
let gameActive=false;
let phase='idle';       // playing | collapsing
let question={};
let score=0, floorNum=1, roundNum=0;
let timeLeft=0, totalTime=0, collapseMs=0;
let particles=[], animT=0;
let answerLocked=false;
let worldY=0;
let nextFloorBuilt=false;

// ── Label texture (no roundRect — use arc corners manually) ──
function makeLabel(num,hex){
  const S=256, cv=document.createElement('canvas');
  cv.width=cv.height=S;
  const g=cv.getContext('2d');

  // Base
  g.fillStyle='#'+hex.toString(16).padStart(6,'0');
  g.fillRect(0,0,S,S);

  // Gradient sheen
  const gr=g.createLinearGradient(0,0,0,S);
  gr.addColorStop(0,'rgba(255,255,255,.2)');
  gr.addColorStop(1,'rgba(0,0,0,.28)');
  g.fillStyle=gr;g.fillRect(0,0,S,S);

  // Dark pill (drawn with arcs, no roundRect)
  const pw=S*.82,ph=S*.58,px=(S-pw)/2,py=(S-ph)/2,r=ph*.35;
  g.fillStyle='rgba(0,0,0,.62)';
  g.beginPath();
  g.moveTo(px+r,py);
  g.lineTo(px+pw-r,py);g.arcTo(px+pw,py,px+pw,py+r,r);
  g.lineTo(px+pw,py+ph-r);g.arcTo(px+pw,py+ph,px+pw-r,py+ph,r);
  g.lineTo(px+r,py+ph);g.arcTo(px,py+ph,px,py+ph-r,r);
  g.lineTo(px,py+r);g.arcTo(px,py,px+r,py,r);
  g.closePath();g.fill();

  // Number
  const str=String(num), fs=str.length>=3?78:106;
  g.font=`900 ${fs}px Fredoka One,Arial Black,sans-serif`;
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  g.strokeStyle='rgba(0,0,0,.95)';g.lineWidth=16;
  g.strokeText(str,S/2,S/2+3);
  g.fillStyle='#fff';g.fillText(str,S/2,S/2+3);

  return new THREE.CanvasTexture(cv);
}

function genQ(){
  const ops=[
    ()=>{const a=rnd(2,9),b=rnd(2,9);return{text:`${a} × ${b} = ?`,ans:a*b};},
    ()=>{const a=rnd(10,50),b=rnd(5,20);return{text:`${a} + ${b} = ?`,ans:a+b};},
    ()=>{const a=rnd(22,60),b=rnd(3,18);return{text:`${a} − ${b} = ?`,ans:a-b};},
    ()=>{const a=rnd(2,9),b=rnd(2,6);return{text:`${a*b} ÷ ${b} = ?`,ans:a};},
    ()=>{const a=rnd(2,9),b=rnd(1,8);return{text:`${a}² + ${b} = ?`,ans:a*a+b};},
  ];
  return ops[~~(Math.random()*ops.length)]();
}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}

// ── Build tiles ──
function clearOldTiles(){oldTiles.forEach(t=>{if(t.group.parent)scene.remove(t.group);});oldTiles=[];}

function buildTiles(atY){
  // Move current tiles to oldTiles (they'll continue to fall/animate briefly)
  clearOldTiles();
  oldTiles=tiles;
  tiles=[];

  question=genQ();
  const nums=new Set([question.ans]);
  let att=0;
  while(nums.size<25&&att++<1200){
    const sp=Math.max(5,~~(question.ans*.45)),n=question.ans+rnd(-sp,sp);
    if(n!==question.ans&&n>0&&n<=250)nums.add(n);
  }
  while(nums.size<25)nums.add(rnd(2,199));
  const vals=shuffle([...nums]).slice(0,25);

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const idx=r*COLS+c, col=PAL[idx], val=vals[idx];
    const grp=new THREE.Group();
    grp.position.set(OX+c*STEP, atY, OZ+r*STEP);

    const sideMat=new THREE.MeshStandardMaterial({color:col,roughness:.45,metalness:.18});
    const topMat=new THREE.MeshStandardMaterial({map:makeLabel(val,col),roughness:.3,metalness:.1});
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(TW,TH,TW),[sideMat,sideMat,topMat,sideMat,sideMat,sideMat]);
    mesh.position.y=TH/2;mesh.castShadow=mesh.receiveShadow=true;grp.add(mesh);

    const rimMat=new THREE.MeshStandardMaterial({color:col,emissive:new THREE.Color(col),emissiveIntensity:.1,transparent:true,opacity:.22});
    const rim=new THREE.Mesh(new THREE.BoxGeometry(TW+.05,TH+.05,TW+.05),rimMat);
    rim.position.y=TH/2;grp.add(rim);

    scene.add(grp);
    tiles.push({grp,mesh,sideMat,rimMat,col:c,row:r,val,color:col,
      state:'solid',bph:Math.random()*Math.PI*2,fv:0,frx:0,frz:0});
  }

  totalTime=Math.max(6000,13000-roundNum*280);
  timeLeft=totalTime;phase='playing';collapseMs=0;answerLocked=false;nextFloorBuilt=false;
  document.getElementById('q-text').textContent=question.text;
  document.getElementById('floor-val').textContent=floorNum;
  roundNum++;
}

// ── Build player ──
function buildPlayer(atY){
  if(pGrp){scene.remove(pGrp);pGrp=null;}
  pGrp=new THREE.Group();
  const M=(col,ro=.4)=>new THREE.MeshStandardMaterial({color:col,roughness:ro});
  const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;pGrp.add(m);};
  add(new THREE.BoxGeometry(.28,.5,.28),M(0x1d4ed8),-.2,.25,0);   // leg L [0]
  add(new THREE.BoxGeometry(.28,.5,.28),M(0x1d4ed8), .2,.25,0);   // leg R [1]
  add(new THREE.BoxGeometry(.72,.9,.46),M(0x3b82f6),   0,.95,0);  // body  [2]
  add(new THREE.BoxGeometry(.64,.64,.64),M(0xfde68a,.6),0,1.71,0);// head  [3]
  add(new THREE.BoxGeometry(.11,.11,.05),M(0x1e3a5f),-.15,1.78,.33);
  add(new THREE.BoxGeometry(.11,.11,.05),M(0x1e3a5f), .15,1.78,.33);
  add(new THREE.BoxGeometry(.70,.22,.70),M(0x1e293b),0,2.10,0);
  add(new THREE.BoxGeometry(.26,.26,.10),new THREE.MeshStandardMaterial({color:0xfde68a,emissive:new THREE.Color(0xfde68a),emissiveIntensity:.8}),0,2.26,.37);
  add(new THREE.BoxGeometry(.22,.5,.12),M(0xef4444,.5),0,.88,-.3);
  const pl=new THREE.PointLight(0x88aaff,.45,4);pl.position.set(0,1.5,0);pGrp.add(pl);

  pGrp.position.set(0, atY+TFLOOR, 0);
  pVel.set(0,0,0);
  pOnGround=true;
  pGrp.userData={locked:false,lx:0,lz:0};
  pGrp.visible=true;
  scene.add(pGrp);
}

// ── Particles ──
function burst(pos,color,n=14){
  for(let i=0;i<n;i++){
    const mat=new THREE.MeshStandardMaterial({color,emissive:new THREE.Color(color),emissiveIntensity:.6,transparent:true,opacity:1});
    const m=new THREE.Mesh(new THREE.BoxGeometry(.15,.15,.15),mat);
    m.position.copy(pos).add(new THREE.Vector3((Math.random()-.5)*2,Math.random()*.5,(Math.random()-.5)*2));
    scene.add(m);
    particles.push({m,mat,v:new THREE.Vector3((Math.random()-.5)*.22,Math.random()*.24+.08,(Math.random()-.5)*.22),life:1});
  }
}

// ── HUD ──
function updateHUD(){document.getElementById('score-val').textContent=score;document.getElementById('floor-val').textContent=floorNum;}
function flashScr(type){
  const el=document.getElementById('flash');
  el.style.background=type==='ok'?'radial-gradient(ellipse at center,rgba(74,222,128,.22) 0%,transparent 70%)':'radial-gradient(ellipse at center,rgba(248,113,113,.26) 0%,transparent 70%)';
  el.style.opacity='1';setTimeout(()=>el.style.opacity='0',320);
}
function showBadge(n){
  const el=document.getElementById('floor-badge');
  document.getElementById('nf-val').textContent=n;
  el.style.display='block';
  setTimeout(()=>el.style.display='none',2200);
}

// ── Collapse ──
function triggerCollapse(){
  if(phase==='collapsing')return;
  phase='collapsing';collapseMs=0;

  tiles.forEach(t=>{
    if(t.val===question.ans){
      t.state='correct';
      t.sideMat.emissive=new THREE.Color(t.color);t.sideMat.emissiveIntensity=.7;
      t.rimMat.emissiveIntensity=1.5;t.rimMat.opacity=.85;
      burst(new THREE.Vector3(t.grp.position.x,worldY+TFLOOR+.5,t.grp.position.z),0x4ade80,16);
    } else {
      t.state='falling';
      t.fv=-(Math.random()*1.5);
      t.frx=(Math.random()-.5)*4;
      t.frz=(Math.random()-.5)*4;
    }
  });

  // After .6s correct tile also falls — player rides it
  setTimeout(()=>{
    tiles.forEach(t=>{if(t.state==='correct'){t.state='ride';t.fv=0;}});
  },600);

  showBadge(floorNum+1);
}

// ── Game flow ──
function startGame(){
  try{
    score=0;floorNum=1;roundNum=0;worldY=0;
    answerLocked=false;nextFloorBuilt=false;
    gameActive=true;

    // Hide overlay
    document.getElementById('overlay').style.display='none';
    document.getElementById('hud').style.display='block';
    document.getElementById('question-center').style.display='block';
    document.getElementById('final-score').style.display='none';
    document.getElementById('play-btn').textContent="▶ Let's Play!";

    updateHUD();
    clearOldTiles();
    buildTiles(worldY);
    buildPlayer(worldY);

    cam.yaw=Math.PI;cam.ty=Math.PI;
    cam.pitch=.42;cam.tp=.42;
    cam.dist=10;cam.td=10;

    if(!clock.running)clock.start();
    else clock.getDelta(); // flush accumulated dt
  } catch(err){
    console.error('startGame error:',err);
  }
}

function endGame(){
  gameActive=false;
  clearOldTiles();
  tiles.forEach(t=>scene.remove(t.grp));tiles=[];
  if(pGrp){scene.remove(pGrp);pGrp=null;}

  document.getElementById('overlay').style.display='flex';
  document.getElementById('hud').style.display='none';
  document.getElementById('question-center').style.display='none';
  document.getElementById('tl1').textContent='Game Over!';
  document.getElementById('tl2').textContent=`Floor ${floorNum} 🏗️`;
  document.getElementById('final-score').style.display='block';
  document.getElementById('final-score').innerHTML=`⭐ Score: <b>${score}</b><br>🏗️ Floor: <b>${floorNum}</b>`;
  document.getElementById('play-btn').textContent='▶ Play Again';
  if(score>0)setTimeout(()=>askName(score,floorNum),400);
}

document.getElementById('quit-btn').addEventListener('click',endGame);

// ── Physics ──
const GRAV=20, JVEL=9, MSPD=5.5;

function updatePlayer(dt){
  if(!pGrp)return;

  // Input
  const rd=new THREE.Vector3();
  if(keys['ArrowLeft'] ||keys['a']||keys['A'])rd.x-=1;
  if(keys['ArrowRight']||keys['d']||keys['D'])rd.x+=1;
  if(keys['ArrowUp']   ||keys['w']||keys['W'])rd.z-=1;
  if(keys['ArrowDown'] ||keys['s']||keys['S'])rd.z+=1;
  const moving=rd.length()>0;
  if(moving){
    rd.normalize();
    const cy=cam.yaw;
    const mx=rd.x*Math.cos(-cy)+rd.z*Math.sin(-cy);
    const mz=-rd.x*Math.sin(-cy)+rd.z*Math.cos(-cy);
    rd.set(mx,0,mz).normalize();
    pGrp.rotation.y=Math.atan2(rd.x,rd.z);
    // Auto-follow camera
    if(!cam.dragging){
      let diff=pGrp.rotation.y+Math.PI-cam.ty;
      while(diff>Math.PI)diff-=2*Math.PI;
      while(diff<-Math.PI)diff+=2*Math.PI;
      cam.ty+=diff*.04;
    }
  }

  // Locked (celebrating on correct tile)
  if(pGrp.userData.locked){
    pGrp.position.set(pGrp.userData.lx, worldY+TFLOOR, pGrp.userData.lz);
    pVel.set(0,0,0);pOnGround=true;
    updateCam();return;
  }

  pVel.x=rd.x*MSPD;
  pVel.z=rd.z*MSPD;
  if(!pOnGround)pVel.y-=GRAV*dt;

  // Ride correct tile as it falls
  if(phase==='collapsing'){
    const rt=tiles.find(t=>t.state==='ride');
    if(rt){
      const ry=rt.grp.position.y+TFLOOR;
      if(pVel.y<=0&&pGrp.position.y<=ry+.4){
        pGrp.position.y=ry;pVel.y=0;pOnGround=true;
      }
    }
  }

  pGrp.position.x+=pVel.x*dt;
  pGrp.position.z+=pVel.z*dt;
  pGrp.position.y+=pVel.y*dt;

  // XZ clamp
  const bnd=(COLS-1)*STEP/2+TW*.5;
  pGrp.position.x=Math.max(-bnd,Math.min(bnd,pGrp.position.x));
  pGrp.position.z=Math.max(-bnd,Math.min(bnd,pGrp.position.z));

  // Ground collision on current tiles
  pOnGround=false;
  let sTile=null;
  tiles.forEach(t=>{
    if(t.state!=='solid'&&t.state!=='correct')return;
    const dx=Math.abs(pGrp.position.x-t.grp.position.x);
    const dz=Math.abs(pGrp.position.z-t.grp.position.z);
    if(dx<HALF&&dz<HALF&&pVel.y<=0&&pGrp.position.y<=worldY+TFLOOR+.4){
      pGrp.position.y=worldY+TFLOOR;pVel.y=0;pOnGround=true;
      if(t.state==='solid')sTile=t;
    }
  });

  // Answer check
  if(phase==='playing'&&pOnGround&&sTile&&!answerLocked){
    if(sTile.val===question.ans){
      answerLocked=true;
      score+=Math.ceil(timeLeft/100);
      updateHUD();flashScr('ok');
      pGrp.userData.locked=true;pGrp.userData.lx=sTile.grp.position.x;pGrp.userData.lz=sTile.grp.position.z;
      sTile.state='correct';
      sTile.sideMat.emissive=new THREE.Color(sTile.color);sTile.sideMat.emissiveIntensity=.8;
      sTile.rimMat.emissiveIntensity=2;sTile.rimMat.opacity=.9;
      burst(new THREE.Vector3(sTile.grp.position.x,worldY+TFLOOR+.5,sTile.grp.position.z),0x4ade80,22);
      setTimeout(()=>{if(pGrp)pGrp.userData.locked=false;triggerCollapse();},1000);
    }
  }

  // Fell far enough → next floor
  if(pGrp.position.y<worldY-8&&phase==='collapsing'&&!nextFloorBuilt){
    nextFloorBuilt=true;
    worldY-=FDROP;floorNum++;updateHUD();
    buildTiles(worldY);
    // Don't rebuild player — let them fall onto the new tiles naturally
  }
  // Safety: fell off completely (walked off edge or missed floor)
  if(pGrp.position.y<worldY-FDROP-5){
    buildPlayer(worldY);
  }

  // Squash/stretch
  if(!pOnGround){const s=pVel.y>0?1.1:.93;pGrp.scale.lerp(new THREE.Vector3(1/s,s,1/s),.2);}
  else{pGrp.scale.lerp(new THREE.Vector3(1,1,1),.2);}

  // Walk cycle
  if(pOnGround&&moving){animT+=dt*8;pGrp.children[0].position.y=.25+Math.sin(animT)*.1;pGrp.children[1].position.y=.25-Math.sin(animT)*.1;}

  updateCam();
}

// ── Roblox camera ──
function updateCam(){
  if(!pGrp)return;
  cam.yaw+=(cam.ty-cam.yaw)*.1;
  cam.pitch+=(cam.tp-cam.pitch)*.1;
  cam.dist+=(cam.td-cam.dist)*.1;
  const head=new THREE.Vector3(pGrp.position.x,pGrp.position.y+1.4,pGrp.position.z);
  const cp=cam.pitch,cy=cam.yaw,cd=cam.dist;
  camera.position.lerp(new THREE.Vector3(
    head.x+cd*Math.sin(cp)*Math.sin(cy),
    head.y+cd*Math.cos(cp),
    head.z+cd*Math.sin(cp)*Math.cos(cy)
  ),.18);
  camera.lookAt(head);
  sun.position.set(pGrp.position.x+8,pGrp.position.y+18,pGrp.position.z+8);
  ptL.position.set(pGrp.position.x,pGrp.position.y+9,pGrp.position.z);
}

// ── Main loop ──
const clock=new THREE.Clock(false);
clock.start();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(!gameActive){renderer.render(scene,camera);return;}

  const T=Date.now()*.001;

  if(phase==='playing'){
    timeLeft-=dt*1000;
    if(timeLeft<=0){timeLeft=0;flashScr('bad');triggerCollapse();}
    const pct=Math.max(0,timeLeft/totalTime);
    document.getElementById('timer-fill').style.width=(pct*100)+'%';
    document.getElementById('timer-fill').style.background=pct>.5?'#4ade80':pct>.25?'#facc15':'#f87171';
  }

  // Current tiles animate
  tiles.forEach(t=>{
    if(t.state==='solid'){
      t.grp.position.y=worldY;
      t.rimMat.emissiveIntensity=.07+Math.sin(T*1.5+t.bph)*.05;
    }
    if(t.state==='correct'){
      t.grp.position.y=worldY;
      t.sideMat.emissiveIntensity=.3+.3*(Math.sin(T*7)*.5+.5);
    }
    if(t.state==='ride'){
      // Falls slowly — player rides on top
      t.fv-=GRAV*.6*dt;
      t.grp.position.y+=t.fv*dt;
    }
    if(t.state==='falling'){
      t.fv-=(GRAV+10)*dt;
      t.grp.position.y+=t.fv*dt;
      t.grp.rotation.x+=t.frx*dt;
      t.grp.rotation.z+=t.frz*dt;
    }
  });

  // Old tiles continue falling and get cleaned up
  oldTiles.forEach(t=>{
    t.fv-=(GRAV+8)*dt;
    t.grp.position.y+=t.fv*dt;
    if(t.grp.position.y<worldY-FDROP-15&&t.grp.parent)scene.remove(t.grp);
  });
  oldTiles=oldTiles.filter(t=>t.grp.parent);

  // Collapse timeout safety
  if(phase==='collapsing'){
    collapseMs+=dt*1000;
    if(collapseMs>5000&&!nextFloorBuilt){
      nextFloorBuilt=true;worldY-=FDROP;floorNum++;updateHUD();
      buildTiles(worldY);if(pGrp)buildPlayer(worldY);
    }
  }

  // Particles
  particles.forEach(p=>{p.v.y-=.012;p.m.position.add(p.v);p.life-=.02;p.mat.opacity=p.life;if(p.life<=0&&p.m.parent)scene.remove(p.m);});
  particles=particles.filter(p=>p.life>0);

  ptL.intensity=.5+Math.sin(T*2)*.18;
  updatePlayer(dt);
  renderer.render(scene,camera);
}
animate();

// ── Camera drag (any mouse button) ──
let drag={on:false,lx:0,ly:0};
canvas.addEventListener('mousedown',e=>{drag.on=true;drag.lx=e.clientX;drag.ly=e.clientY;cam.dragging=true;});
window.addEventListener('mouseup',()=>{drag.on=false;cam.dragging=false;});
window.addEventListener('mousemove',e=>{
  if(!drag.on)return;
  cam.ty-=(e.clientX-drag.lx)*.007;
  cam.tp=Math.max(.08,Math.min(1.4,cam.tp-(e.clientY-drag.ly)*.005));
  drag.lx=e.clientX;drag.ly=e.clientY;
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{cam.td=Math.max(4,Math.min(18,cam.td+e.deltaY*.012));},{passive:true});

// Touch camera
let td={on:false,lx:0,ly:0};
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1&&!e.target.closest('#dpad')&&e.target.id!=='btn-jump'){
    td.on=true;td.lx=e.touches[0].clientX;td.ly=e.touches[0].clientY;cam.dragging=true;
  }
},{passive:true});
window.addEventListener('touchend',()=>{td.on=false;cam.dragging=false;},{passive:true});
window.addEventListener('touchmove',e=>{
  if(!td.on||e.touches.length!==1)return;
  cam.ty-=(e.touches[0].clientX-td.lx)*.007;
  cam.tp=Math.max(.08,Math.min(1.4,cam.tp-(e.touches[0].clientY-td.ly)*.005));
  td.lx=e.touches[0].clientX;td.ly=e.touches[0].clientY;
},{passive:true});

// ── Keyboard ──
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){e.preventDefault();if(pOnGround&&gameActive){pVel.y=JVEL;pOnGround=false;}}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>{delete keys[e.key];});

// ── Mobile dpad ──
function bindDp(id,key){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true;},{passive:false});
  el.addEventListener('touchend',  e=>{e.preventDefault();keys[key]=false;},{passive:false});
  el.addEventListener('touchcancel',e=>{e.preventDefault();keys[key]=false;},{passive:false});
  el.addEventListener('mousedown',()=>keys[key]=true);
  el.addEventListener('mouseup',  ()=>keys[key]=false);
}
bindDp('dp-up','ArrowUp');bindDp('dp-down','ArrowDown');
bindDp('dp-left','ArrowLeft');bindDp('dp-right','ArrowRight');
const jb=document.getElementById('btn-jump');
const doJump=e=>{e.preventDefault();if(pOnGround&&gameActive){pVel.y=JVEL;pOnGround=false;}};
jb.addEventListener('touchstart',doJump,{passive:false});
jb.addEventListener('mousedown',doJump);

// ── Play button ──
document.getElementById('play-btn').addEventListener('click',startGame);
</script>
